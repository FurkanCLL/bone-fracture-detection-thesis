[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-fracture-detection-thesis"
version = "0.1.0"
description = "Deep learning-based object detection pipeline for bone fracture localization in X-ray images."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11.0,<13.0",
]

[project.scripts]
audit-dataset = "bone_fracture_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
